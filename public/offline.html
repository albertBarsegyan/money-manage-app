<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6b5ce7" />
    <title>Finora is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f8fa; color: #252833; font: 16px Arial, sans-serif; }
      main { max-width: 420px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { margin: 22px 0 10px; font-size: 24px; }
      p { color: #777d8d; line-height: 1.6; }
      button { margin-top: 12px; padding: 11px 18px; border: 0; border-radius: 8px; background: #6b5ce7; color: white; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon-for-public/web-app-manifest-192x192.png" alt="Finora" />
      <h1>You’re offline</h1>
      <p>Finora needs to load once while you’re online. After that, your saved workspace is available on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
